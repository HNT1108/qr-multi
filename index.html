<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tải ứng dụng</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
    color: #000;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 36px 20px;
    text-align: center;
  }
  .logo {
    width: 120px;
    height: 120px;
    border-radius: 24px;
    object-fit: cover;
    display: block;
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 26px;
    margin: 0 0 12px;
    font-weight: 700;
  }
  p {
    font-size: 16px;
    margin: 0 0 28px;
    color: #444;
  }
  a.store-btn {
    display: block;
    padding: 14px 18px;
    margin: 0 auto 16px;
    width: 85%;
    max-width: 360px;
    border-radius: 12px;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    font-size: 16px;
  }
  .android { background: #3DDC84; color: #000; }
  .ios { background: #000; }
</style>
</head>
<body>

<div class="container">

  <!-- Logo -->
  <img src="https://via.placeholder.com/200" class="logo">

  <!-- Tiêu đề -->
  <h1>Tải ứng dụng</h1>

  <!-- Mô tả -->
  <p>Nhấn vào cửa hàng phù hợp với thiết bị của bạn</p>

  <!-- Button Android -->
  <a
    class="store-btn android"
    href="https://play.google.com/store/apps/details?id=com.quycan.app"
    target="_blank"
    rel="noopener noreferrer">
    Tải trên Google Play
  </a>

  <!-- Button iOS -->
  <a
    class="store-btn ios"
    href="https://apps.apple.com/app/id6753736057"
    target="_blank"
    rel="noopener noreferrer">
    Tải trên App Store
  </a>

</div>

</body>
</html>
